name: P1 Dependency Remediation

on:
  push:
    branches:
      - codex/priority-01-enterprise-foundation
    paths:
      - .github/workflows/p1-dependency-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    name: Update vulnerable frontend dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out foundation branch
        uses: actions/checkout@v4
        with:
          ref: codex/priority-01-enterprise-foundation
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Apply compatible security updates
        working-directory: frontend
        run: npm audit fix
      - name: Verify high-severity audit gate
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Commit dependency remediation
        shell: bash
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo "No dependency changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "fix(frontend): remediate high-severity dependency advisories [skip ci]"
          git push origin HEAD:codex/priority-01-enterprise-foundation
