name: Vetrix CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "agent/**", "codex/**"]

permissions:
  contents: read

concurrency:
  group: vetrix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run frontend verification
        run: npm run verify
      - name: Audit frontend dependencies
        run: npm run verify:security

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run backend unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile backend
        run: python -m compileall -q .

  migrations:
    name: Alembic migration lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated migration lifecycle test
        run: python -m unittest tests.test_migrations -v
      - name: Show migration history
        run: VETRIX_DATABASE_URL=sqlite:///./ci-migration-history.db python scripts/migrate.py history
