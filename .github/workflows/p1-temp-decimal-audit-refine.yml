name: P1 Refine Decimal Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: github.event.pull_request.head.ref == 'codex/priority-01-enterprise-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/priority-01-enterprise-foundation
          fetch-depth: 0

      - name: Exclude Python float calls from raw SQL detection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/audit_decimal_money.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for number, line in enumerate(text.splitlines(), 1):
              for match in sql_pattern.finditer(line):
                  name, current = match.groups()
                  classification = classify_name(name)
                  findings.append(Finding(
                      "raw-sql", relative(path), number, name, current.upper(),
                      target_for(classification), classification, line.strip()[:300],
                      "yes", risk_for(classification, current),
                  ))
          '''
          new = '''    for number, line in enumerate(text.splitlines(), 1):
              stripped = line.strip()
              sql_context = (
                  any(token in stripped.upper() for token in ("CREATE TABLE", "ALTER TABLE", "ADD COLUMN"))
                  or (any(quote in stripped for quote in ('"', "'")) and any(token in stripped.upper() for token in (" FLOAT", " REAL", " DOUBLE")))
              )
              if not sql_context:
                  continue
              for match in sql_pattern.finditer(line):
                  name, current = match.groups()
                  classification = classify_name(name)
                  findings.append(Finding(
                      "raw-sql", relative(path), number, name, current.upper(),
                      target_for(classification), classification, line.strip()[:300],
                      "yes", risk_for(classification, current),
                  ))
          '''
          if old not in text:
              raise SystemExit('Expected scanner block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Regenerate audit evidence
        run: python scripts/audit_decimal_money.py

      - name: Commit refined evidence and remove workflow
        run: |
          rm -f .github/workflows/p1-temp-decimal-audit-refine.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit_decimal_money.py docs/audits/P1-03_* .github/workflows/p1-temp-decimal-audit-refine.yml
          git commit -m "fix(audit): exclude non-SQL float calls from inventory"
          git push origin HEAD:codex/priority-01-enterprise-foundation
