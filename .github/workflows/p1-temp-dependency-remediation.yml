name: P1 One-Shot Dependency Remediation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.pull_request.head.ref == 'codex/priority-01-enterprise-foundation'
    name: Remediate and remove temporary workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out foundation branch
        uses: actions/checkout@v4
        with:
          ref: codex/priority-01-enterprise-foundation
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Apply reviewed security updates
        working-directory: frontend
        run: npm audit fix --force
      - name: Verify frontend after dependency changes
        working-directory: frontend
        run: npm run verify
      - name: Verify high-severity security gate
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Remove temporary workflow and commit results
        shell: bash
        run: |
          rm -f .github/workflows/p1-temp-dependency-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json .github/workflows/p1-temp-dependency-remediation.yml
          if git diff --cached --quiet; then
            echo "No dependency changes were required."
            exit 0
          fi
          git commit -m "fix(frontend): remediate vulnerable dependencies"
          git push origin HEAD:codex/priority-01-enterprise-foundation
