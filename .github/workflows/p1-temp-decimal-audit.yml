name: P1 One-Shot Decimal Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'codex/priority-01-enterprise-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out foundation branch
        uses: actions/checkout@v4
        with:
          ref: codex/priority-01-enterprise-foundation
          fetch-depth: 0

      - name: Run decimal money audit
        run: python scripts/audit_decimal_money.py

      - name: Commit audit evidence and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/p1-temp-decimal-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit_decimal_money.py docs/audits/P1-03_* .github/workflows/p1-temp-decimal-audit.yml
          git commit -m "docs(audit): record P1-03 decimal migration inventory"
          git push origin HEAD:codex/priority-01-enterprise-foundation
